<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>770 Habad Quiz</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png">
<link rel="icon" type="image/png" href="assets/icons/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="770 Quiz">
<meta name="theme-color" content="#110d09">
<meta name="description" content="770 Habad Quiz : 2000 questions sur les Rabbeim, la 'hassidout, les minhaguim et l'histoire de Habad.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Cinzel:wght@700&family=Frank+Ruhl+Libre:wght@700;900&family=Playfair+Display:ital,wght@1,900&family=Rubik:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
/* 770 Habad Quiz — fond sombre chaud, accents or. Une colonne centrée (max 560px), écrans remplacés sur place avec un léger fondu. */
:root{
  color-scheme: dark;
  --bg:#110d09;
  --surface:rgba(33,26,19,.92);
  --surface-2:#2d2319;
  --line:#4b3b28;
  --ink:#f6eedf;
  --muted:#bcab8f;
  --gold:#e3b25b;
  --gold-2:#f6d388;
  --gold-ink:#1d1307;
  --good:#4cc38a;
  --bad:#ea6b55;
  --l1:#4cc38a; --l2:#e3b25b; --l3:#ee8a45; --l4:#e2525f;
  --display:"Frank Ruhl Libre", Georgia, serif;
  --body:"Rubik", system-ui, -apple-system, "Segoe UI", sans-serif;
  --r:16px;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:radial-gradient(90% 50% at 50% 0%, #22190f 0%, var(--bg) 70%) fixed, var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.45;-webkit-tap-highlight-color:transparent}
button,input,select{font:inherit;color:inherit}
#app{position:relative;z-index:1;max-width:560px;margin:0 auto;min-height:100%;display:flex;flex-direction:column;
  padding:calc(env(safe-area-inset-top) + 18px) calc(env(safe-area-inset-right) + 18px) calc(env(safe-area-inset-bottom) + 22px) calc(env(safe-area-inset-left) + 18px);gap:16px}
h1,h2{font-family:var(--display);font-weight:900;text-wrap:balance;margin:0;letter-spacing:-.01em}
h1{font-size:2.4rem;line-height:1.02}
h2{font-size:1.75rem;line-height:1.1}
p{margin:0}
.muted{color:var(--muted)}
.small{font-size:.88rem}
.row{display:flex;gap:10px;align-items:center}
.between{justify-content:space-between}
.stack{display:flex;flex-direction:column;gap:10px}
.grow{flex:1}
.btn{appearance:none;border:1px solid var(--line);background:var(--surface);border-radius:var(--r);padding:14px 16px;font-weight:600;cursor:pointer;text-align:left;transition:transform .08s ease, background .15s, border-color .15s}
.btn:active{transform:scale(.985)}
.btn:focus-visible,.chip:focus-visible,input:focus-visible,.opt:focus-visible,.lvl:focus-visible,.theme:focus-visible{outline:3px solid var(--gold-2);outline-offset:2px}
.btn.primary{background:linear-gradient(180deg,var(--gold-2),var(--gold));color:var(--gold-ink);border-color:var(--gold);text-align:center;font-weight:700;box-shadow:0 6px 22px rgba(227,178,91,.22)}
.btn.lg{font-size:1.2rem;padding:18px}
.btn.ghost{background:transparent}
.btn.center{text-align:center}
.btn[disabled]{opacity:.4;cursor:default;box-shadow:none}
.tile{display:flex;gap:14px;align-items:center;padding:15px 16px}
.tile .ic{width:44px;height:44px;border-radius:12px;background:var(--surface-2);display:grid;place-items:center;color:var(--gold);flex:none}
.tile .ic svg{width:24px;height:24px}
.tile b{display:block;font-size:1.05rem}
.tile span{color:var(--muted);font-weight:400;font-size:.9rem}
.duo{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.duo .btn{padding:13px 14px}
.duo .btn b{display:block}
.duo .btn span{color:var(--muted);font-weight:400;font-size:.85rem}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.label{font-size:.8rem;color:var(--muted);font-weight:600}
.step{font-size:.8rem;color:var(--gold);font-weight:600}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:9px 16px;font-size:.95rem;cursor:pointer;font-weight:500}
.chip[aria-pressed="true"]{background:var(--gold);color:var(--gold-ink);border-color:var(--gold);font-weight:700}
input[type=text]{width:100%;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;font-size:1.05rem}
input.code{text-transform:uppercase;letter-spacing:.35em;font-weight:700;text-align:center;font-size:1.6rem}
.top{display:flex;align-items:center;gap:12px;min-height:32px;padding-right:56px}
.back{appearance:none;background:transparent;border:0;color:var(--muted);padding:6px 0;cursor:pointer;font-weight:600}
.top .label{color:var(--gold)}
/* home */
.hero{display:flex;flex-direction:column;align-items:center;text-align:center;gap:12px;padding-top:6px}
.logo{width:104px;height:104px;border-radius:24px;box-shadow:0 0 0 1px rgba(227,178,91,.5),0 10px 40px rgba(227,178,91,.25)}
.hero h1 .n{color:var(--gold);display:block;font-size:3.4rem;line-height:.95;letter-spacing:.04em}
/* niveaux */
.lvls{display:flex;flex-direction:column;gap:10px}
.lvl{appearance:none;display:flex;align-items:center;gap:14px;width:100%;text-align:left;background:var(--surface);border:1.5px solid var(--line);border-radius:var(--r);padding:16px;cursor:pointer;transition:transform .08s, border-color .15s}
.lvl:active{transform:scale(.985)}
.lvl.on{border-color:var(--c,var(--gold))}
.lvl .bars{display:flex;gap:3px;align-items:flex-end;height:26px;flex:none;width:30px}
.lvl .bars i{width:6px;border-radius:2px;background:var(--surface-2)}
.lvl .bars i:nth-child(1){height:30%}.lvl .bars i:nth-child(2){height:55%}.lvl .bars i:nth-child(3){height:78%}.lvl .bars i:nth-child(4){height:100%}
.lvl .bars i.f{background:var(--c,var(--gold))}
.lvl b{display:block;font-size:1.15rem;color:var(--ink)}
.lvl span{color:var(--muted);font-size:.9rem}
.lvl .cnt{margin-left:auto;font-size:.8rem;color:var(--muted);text-align:right;font-variant-numeric:tabular-nums;flex:none}
.lvl[disabled]{opacity:.4;cursor:default}
.pickd{display:flex;align-items:center;gap:10px;padding:10px 14px}
.pickd .dot{width:10px;height:10px;border-radius:50%;background:var(--c,var(--gold));flex:none}
.pickd button{margin-left:auto;background:transparent;border:0;color:var(--gold);font-weight:600;cursor:pointer;padding:4px}
.themes{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.theme{appearance:none;text-align:left;background:var(--surface);border:1.5px solid var(--line);border-radius:14px;padding:12px;cursor:pointer;min-height:64px;display:flex;flex-direction:column;justify-content:space-between;gap:4px}
.theme b{font-size:.95rem;line-height:1.2}
.theme span{font-size:.78rem;color:var(--muted)}
.theme.all{grid-column:1 / -1;min-height:auto}
.theme[aria-pressed="true"]{border-color:var(--gold);background:color-mix(in srgb,var(--gold) 14%,var(--surface))}
.theme[disabled]{opacity:.35;cursor:default}
.sticky{position:sticky;bottom:calc(env(safe-area-inset-bottom) + 10px);z-index:2;display:flex;flex-direction:column}
/* jeu */
.bar{height:6px;border-radius:6px;background:var(--surface-2);overflow:hidden}
.bar i{display:block;height:100%;background:var(--gold);border-radius:6px;transition:width .3s}
.qmeta{display:flex;gap:8px;flex-wrap:wrap}
.pill{font-size:.75rem;padding:4px 10px;border-radius:999px;background:var(--surface-2);color:var(--muted);font-weight:600;display:inline-flex;align-items:center;gap:6px}
.pill .dot{width:8px;height:8px;border-radius:50%;background:var(--c,var(--gold))}
.qphoto{margin:0;border-radius:16px;overflow:hidden;border:1px solid var(--line);background:var(--surface-2);aspect-ratio:16/9;position:relative}
.qphoto img{width:100%;height:100%;object-fit:cover;display:block;filter:saturate(.9)}
.qphoto figcaption{position:absolute;left:0;right:0;bottom:0;padding:18px 12px 8px;font-size:.75rem;color:#f4ead8;background:linear-gradient(transparent,rgba(0,0,0,.7))}
.qtext{font-family:var(--display);font-size:1.55rem;line-height:1.25;font-weight:700;text-wrap:balance}
.opts{display:flex;flex-direction:column;gap:10px}
.opt{appearance:none;display:flex;gap:12px;align-items:center;width:100%;text-align:left;background:var(--surface);border:1.5px solid var(--line);border-radius:var(--r);padding:14px;cursor:pointer;font-weight:500;font-size:1.02rem}
.opt .k{width:30px;height:30px;border-radius:9px;background:var(--surface-2);display:grid;place-items:center;font-weight:700;font-size:.85rem;flex:none;color:var(--gold)}
.opt.sel{border-color:var(--gold)}
.opt.sel .k{background:var(--gold);color:var(--gold-ink)}
.opt.ok{border-color:var(--good);background:color-mix(in srgb,var(--good) 18%,var(--surface))}
.opt.ok .k{background:var(--good);color:#06210f}
.opt.ko{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 16%,var(--surface))}
.opt.ko .k{background:var(--bad);color:#2a0702}
.opt[disabled]{cursor:default}
.feedback{border-left:4px solid var(--good);padding:12px 14px;background:var(--surface);border-radius:0 var(--r) var(--r) 0}
.feedback.bad{border-color:var(--bad)}
.feedback b{display:block;margin-bottom:2px;font-size:1.05rem}
.big{font-family:var(--display);font-size:4rem;font-weight:900;line-height:1;font-variant-numeric:tabular-nums;color:var(--gold)}
.codebox{font-family:var(--display);font-size:3rem;letter-spacing:.18em;font-weight:900;color:var(--gold);text-align:center;padding:10px 0}
.players{display:flex;flex-direction:column;gap:6px}
.player{display:flex;justify-content:space-between;align-items:center;padding:10px 12px;border-radius:10px;background:var(--surface-2);font-variant-numeric:tabular-nums}
.player.me{outline:1.5px solid var(--gold)}
.player .rk{width:26px;color:var(--muted);font-weight:700}
.player .st{font-size:.8rem;color:var(--muted)}
.timer{font-variant-numeric:tabular-nums;font-weight:700;font-size:1.1rem;min-width:44px;text-align:right}
.timer.low{color:var(--bad)}
.statrow{display:grid;grid-template-columns:1fr auto;gap:4px 12px;align-items:center}
.statrow .bar{grid-column:1 / -1}
.tiles3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.tiles3 .card{padding:12px;text-align:center}
.tiles3 b{display:block;font-size:1.6rem;font-family:var(--display);font-variant-numeric:tabular-nums;color:var(--gold)}
.review{display:flex;flex-direction:column;gap:8px}
.review .card{padding:12px 14px}
.review .ans{font-size:.9rem;margin-top:4px}
.toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 20px);transform:translateX(-50%);background:var(--surface-2);border:1px solid var(--line);padding:10px 16px;border-radius:12px;font-size:.9rem;max-width:90vw;z-index:20}
.modal{position:fixed;inset:0;background:rgba(10,7,4,.75);display:grid;place-items:center;padding:20px;z-index:10}
.modal .card{max-width:400px;width:100%;display:flex;flex-direction:column;gap:14px;background:#211a13}
.spacer{flex:1}

/* ---------- refonte : accueil ---------- */
.center-txt{text-align:center}
.home-grid{display:flex;flex-direction:column;gap:14px}
.rank{display:flex;gap:14px;align-items:center;padding:14px 16px;border-radius:var(--r);border:1px solid rgba(227,178,91,.35);
  background:linear-gradient(135deg,rgba(227,178,91,.14),rgba(33,26,19,.92) 60%);backdrop-filter:blur(6px)}
.rank-badge{width:48px;height:48px;border-radius:14px;flex:none;display:grid;place-items:center;font-family:var(--display);font-weight:900;font-size:1.5rem;
  color:var(--gold-ink);background:linear-gradient(160deg,var(--gold-2),var(--gold));box-shadow:0 4px 18px rgba(227,178,91,.35)}
.rank-body{flex:1;display:flex;flex-direction:column;gap:6px;min-width:0}
.rank-body b{font-size:1.1rem}
.rank .xp{font-size:.85rem;color:var(--gold);font-weight:700;font-variant-numeric:tabular-nums}
.rank small{font-size:.8rem}
.chips-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.chips-stats div{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px;text-align:center;display:flex;flex-direction:column;gap:2px}
.chips-stats b{font-family:var(--display);font-size:1.35rem;color:var(--gold);font-variant-numeric:tabular-nums;line-height:1.1}
.chips-stats span{font-size:.72rem;color:var(--muted);line-height:1.2}
.cta{appearance:none;border:0;cursor:pointer;display:flex;align-items:center;gap:16px;padding:18px 20px;border-radius:20px;text-align:left;color:var(--gold-ink);
  background:linear-gradient(135deg,var(--gold-2) 0%,var(--gold) 55%,#c98f35 100%);box-shadow:0 10px 34px rgba(227,178,91,.32),inset 0 1px 0 rgba(255,255,255,.45);
  transition:transform .12s ease, box-shadow .2s ease;position:relative;overflow:hidden}
.cta::after{content:"";position:absolute;inset:0;background:linear-gradient(115deg,transparent 35%,rgba(255,255,255,.35) 50%,transparent 65%);transform:translateX(-120%);animation:ctaShine 4s ease-in-out 1.5s infinite}
@keyframes ctaShine{0%,70%{transform:translateX(-120%)}100%{transform:translateX(120%)}}
.cta:hover{transform:translateY(-2px);box-shadow:0 14px 40px rgba(227,178,91,.42)}
.cta:active{transform:scale(.985)}
.cta-play{width:52px;height:52px;border-radius:50%;background:var(--gold-ink);color:var(--gold-2);display:grid;place-items:center;flex:none}
.cta-play svg{width:24px;height:24px;fill:currentColor;stroke:none;margin-left:3px}
.cta b{display:block;font-size:1.3rem;font-weight:800}
.cta small{font-size:.88rem;opacity:.8;font-weight:500}
.modes{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.mode{appearance:none;cursor:pointer;text-align:left;display:flex;flex-direction:column;gap:4px;padding:14px;border-radius:var(--r);border:1px solid var(--line);
  background:var(--surface);backdrop-filter:blur(6px);transition:transform .12s ease,border-color .2s,background .2s;min-height:112px}
.mode .ic{width:38px;height:38px;border-radius:11px;background:var(--surface-2);display:grid;place-items:center;color:var(--gold);margin-bottom:4px}
.mode .ic svg{width:21px;height:21px}
.mode b{font-size:1rem}
.mode span{font-size:.8rem;color:var(--muted);line-height:1.3}
.mode:hover{border-color:rgba(227,178,91,.6);transform:translateY(-2px)}
.mode:active{transform:scale(.98)}
.mode.hot .ic{background:color-mix(in srgb,var(--l4) 25%,var(--surface-2));color:#ff9d8f}
.daily{appearance:none;cursor:pointer;text-align:left;display:flex;flex-direction:column;gap:6px;padding:16px;border-radius:var(--r);
  border:1px dashed rgba(227,178,91,.55);background:rgba(33,26,19,.85);backdrop-filter:blur(6px);transition:border-color .2s}
.daily:hover{border-color:var(--gold)}
.daily-tag{font-size:.72rem;text-transform:uppercase;letter-spacing:.12em;color:var(--gold);font-weight:700}
.daily b{font-family:var(--display);font-size:1.15rem;line-height:1.3}
.daily small{color:var(--muted);font-size:.8rem}
/* ---------- refonte : jeu ---------- */
.hud{gap:8px}
.hud-r{display:flex;gap:6px;margin-left:auto}
.hud-chip{display:inline-flex;align-items:center;gap:5px;padding:5px 10px;border-radius:999px;background:var(--surface-2);font-weight:700;font-size:.9rem;font-variant-numeric:tabular-nums}
.hud-chip svg{width:15px;height:15px;color:var(--gold)}
.hud-chip.streak.hot{background:color-mix(in srgb,#ff7a3d 30%,var(--surface-2));animation:pop .35s ease}
.hud-chip.streak.hot svg{color:#ffb36b}
.segs{display:flex;gap:4px}
.segs i{flex:1;height:6px;border-radius:4px;background:var(--surface-2);transition:background .3s}
.segs i.done{background:var(--gold)}
.segs i.cur{background:color-mix(in srgb,var(--gold) 45%,var(--surface-2))}
.qcard{background:linear-gradient(180deg,rgba(45,35,25,.95),rgba(33,26,19,.95));border:1px solid var(--line);border-radius:20px;padding:16px;display:flex;flex-direction:column;gap:12px;
  box-shadow:0 12px 40px rgba(0,0,0,.35);animation:cardIn .35s ease both}
.qcard .qphoto{margin:0 -4px}
@keyframes cardIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.opt{transition:transform .1s ease,border-color .15s,background .2s;animation:optIn .35s ease both;animation-delay:var(--d,0ms)}
@keyframes optIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@media (hover:hover){.opt:not([disabled]):hover{border-color:rgba(227,178,91,.7);background:color-mix(in srgb,var(--gold) 8%,var(--surface))}}
.opt:not([disabled]):active{transform:scale(.985)}
.opt.ok{animation:okPulse .5s ease}
@keyframes okPulse{0%{transform:scale(1)}40%{transform:scale(1.03);box-shadow:0 0 0 6px color-mix(in srgb,var(--good) 25%,transparent)}100%{transform:scale(1)}}
.opt.shake{animation:shake .45s ease}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-8px)}40%{transform:translateX(7px)}60%{transform:translateX(-5px)}80%{transform:translateX(3px)}}
@keyframes pop{0%{transform:scale(1)}50%{transform:scale(1.18)}100%{transform:scale(1)}}
.burst{position:fixed;width:0;height:0;pointer-events:none;z-index:50}
.burst i{position:absolute;width:7px;height:7px;border-radius:2px;background:hsl(var(--h),85%,62%);animation:burst .8s cubic-bezier(.2,.7,.3,1) forwards}
@keyframes burst{from{transform:translate(0,0) rotate(0);opacity:1}to{transform:translate(var(--x),var(--y)) rotate(200deg);opacity:0}}
.floatpts{position:fixed;z-index:50;pointer-events:none;font-weight:800;color:var(--good);font-size:1.2rem;animation:floatUp 1.1s ease forwards;text-shadow:0 2px 10px rgba(0,0,0,.6)}
@keyframes floatUp{from{opacity:0;transform:translateY(6px)}20%{opacity:1}to{opacity:0;transform:translateY(-40px)}}
.feedback{border-left:0;border:1px solid color-mix(in srgb,var(--good) 45%,var(--line));background:color-mix(in srgb,var(--good) 9%,var(--surface));border-radius:var(--r);padding:14px 16px;display:flex;flex-direction:column;gap:8px;animation:cardIn .3s ease both}
.feedback.bad{border-color:color-mix(in srgb,var(--bad) 45%,var(--line));background:color-mix(in srgb,var(--bad) 8%,var(--surface))}
.fb-head{display:flex;align-items:center;gap:10px}
.fb-head b{margin:0;font-size:1.08rem}
.fb-ic{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font-weight:800;background:var(--good);color:#06210f;flex:none}
.feedback.bad .fb-ic{background:var(--bad);color:#2a0702}
.fb-ans{font-size:.98rem}.feedback .fb-ans b,.feedback .expl b{display:inline;margin:0;font-size:inherit}
.expl{font-size:.95rem;line-height:1.5;color:#efe4cf}
.expl-tag{display:block;font-size:.72rem;text-transform:uppercase;letter-spacing:.12em;color:var(--gold);font-weight:700;margin-bottom:3px}
.expl-s{color:#e6dac3}
.feedback .src{border-top-color:rgba(255,255,255,.08)}
/* ---------- refonte : résultat ---------- */
.result{display:flex;flex-direction:column;align-items:center;text-align:center;gap:8px;padding-top:4px}
.ring{position:relative;width:150px;height:150px}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring-bg{fill:none;stroke:var(--surface-2);stroke-width:10}
.ring-fg{fill:none;stroke:var(--gold);stroke-width:10;stroke-linecap:round;animation:ringFill 1.2s cubic-bezier(.3,.8,.3,1) .2s forwards}
@keyframes ringFill{to{stroke-dashoffset:var(--to)}}
.ring-txt{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ring-txt b{font-family:var(--display);font-size:2.2rem;color:var(--gold);line-height:1}
.ring-txt span{color:var(--muted);font-size:.85rem}
.tiles3 .card b{font-size:1.3rem}
.levelup{padding:14px 16px;border-radius:var(--r);background:linear-gradient(135deg,rgba(227,178,91,.25),rgba(33,26,19,.9));border:1px solid var(--gold);text-align:center;animation:pop .5s ease}
/* ---------- ordinateur et tablette ---------- */
@media (min-width:760px){
  #app{max-width:640px;padding-top:calc(env(safe-area-inset-top) + 28px)}
  .qtext{font-size:1.75rem}
  .opts{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .opt{min-height:68px}
}
@media (min-width:1000px){
  body.home #app{max-width:1040px}

(function(){

  var reduce = window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches;
  // titre lettre par lettre
  var t = sp.querySelector(".sp-title"), k = 0;
  [].slice.call(t.childNodes).forEach(function(node){
    var txt = node.textContent, wrap = document.createDocumentFragment();
    txt.split("").forEach(function(ch){
      var e = document.createElement("span"); e.className = "l"; e.textContent = ch === " " ? "\u00a0" : ch;
      e.style.animationDelay = (0.55 + k++ * 0.055) + "s"; wrap.appendChild(e);
    });
    if(node.nodeType === 1){ node.textContent = ""; node.appendChild(wrap); } else { t.replaceChild(wrap, node); }
  });
  // étincelles dorées qui montent

  sp.addEventListener("click", close);

<script>
"use strict";
/* ---------- data ---------- */
let Q = [];            // [question, [4 options], correctIndex, source, level, category, subcategory]
let CATS = [];
const LEVELS = {"1":"Facile","2":"Moyen","3":"Difficile","4":"Expert"};
const LEVEL_INFO = {
  "1":{d:"Les notions essentielles", c:"var(--l1)"},
  "2":{d:"Connaissances générales approfondies", c:"var(--l2)"},
  "3":{d:"Questions pointues et détaillées", c:"var(--l3)"},
  "4":{d:"Réservé aux connaisseurs confirmés", c:"var(--l4)"}
};

/* ---------- storage (best effort) ---------- */
const store = {
  get(k, d){ try{ const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; }catch(e){ return d; } },
  set(k, v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} }
};
let progress = {}; // index -> [seen, correct, lastOk(0/1)] ; enregistré par texte de question (hq_progress2)
function saveProgress(){
  const out = {}; for(const k in progress){ const q = Q[k]; if(q) out[q[0]] = progress[k]; }
  store.set("hq_progress2", out);
}
function loadProgress(){
  const byText = {}; Q.forEach((q,i)=>{ byText[q[0]] = i; });
  const saved = store.get("hq_progress2", null);
  if(saved){ for(const t in saved){ if(t in byText) progress[byText[t]] = saved[t]; } return Promise.resolve(); }
  const old = store.get("hq_progress", null);
  if(!old) return Promise.resolve();
  // ancienne progression (numéros de l'ancienne liste) : conversion une seule fois
  return fetch("data/legacy-ids.json").then(r=>r.json()).then(map=>{
    for(const k in old){ if(k in map) progress[map[k]] = old[k]; }
    saveProgress();
  }).catch(()=>{});
}
function record(id, ok){
  const p = progress[id] || [0,0,0];
  p[0]++; if(ok) p[1]++; p[2] = ok ? 1 : 0;
  progress[id] = p; saveProgress();
}

/* ---------- helpers ---------- */
const app = document.getElementById("app");
function h(tag, attrs, ...kids){
  const el = document.createElement(tag);
  if(attrs) for(const [k,v] of Object.entries(attrs)){
    if(v === false || v == null) continue;
    if(k === "class") el.className = v;
    else if(k.startsWith("on")) el.addEventListener(k.slice(2), v);
    else el.setAttribute(k, v === true ? "" : v);
  }
  for(const c of kids.flat()){ if(c == null || c === false) continue; el.append(c.nodeType ? c : document.createTextNode(String(c))); }
  return el;
}
function svg(path){ const s = document.createElementNS("http://www.w3.org/2000/svg","svg"); s.setAttribute("viewBox","0 0 24 24"); s.setAttribute("fill","none"); s.setAttribute("stroke","currentColor"); s.setAttribute("stroke-width","1.8"); s.setAttribute("stroke-linecap","round"); s.setAttribute("stroke-linejoin","round"); s.innerHTML = path; return s; }
const ICON = {
  flame:'<path d="M12 3c1 3 4 4.5 4 8.5a4 4 0 0 1-8 0c0-2 1-3 2-4 0 2 1 3 2 3 0-3-1-5 0-7.5Z"/><path d="M6 21h12"/>',
  fete:'<path d="M12 2v3"/><path d="M5 8h14"/><path d="M7 8v6a5 5 0 0 0 10 0V8"/><path d="M12 19v3M8 22h8"/>',
  solo:'<circle cx="12" cy="8" r="3.5"/><path d="M5 20c1.2-3.6 4-5 7-5s5.8 1.4 7 5"/>',
  multi:'<circle cx="8" cy="9" r="3"/><circle cx="17" cy="10" r="2.5"/><path d="M2.5 19c1-3 3.2-4.5 5.5-4.5s4.5 1.5 5.5 4.5"/><path d="M14 15.2c.9-.5 1.9-.7 3-.7 2 0 3.6 1.2 4.5 3.8"/>',
  stats:'<path d="M4 20V10"/><path d="M10 20V4"/><path d="M16 20v-7"/><path d="M22 20H2"/>',
  redo:'<path d="M4 12a8 8 0 1 0 2.3-5.6"/><path d="M4 4v4h4"/>',
  expert:'<path d="M12 2l2.4 5 5.6.8-4 3.9 1 5.5L12 14.6 7 17.2l1-5.5-4-3.9 5.6-.8z"/><path d="M8 22h8"/>',
  chev:'<path d="M9 6l6 6-6 6"/>'
};
let lastScreen = null;
let KEYS = null;   // raccourcis clavier de l'écran en cours
function screenKey(){ const el = app.querySelector(".qtext, h2, h1, .loading"); return el ? el.textContent : ""; }
function render(...nodes){
  KEYS = null;
  app.replaceChildren(...nodes);
  document.body.classList.toggle("home", !!app.querySelector(".brand"));
  // on ne rejoue le fondu et le retour en haut que si l'écran change vraiment (pas à chaque seconde du minuteur)
  const key = screenKey();
  const playing = !!app.querySelector(".qtext");   // pendant le jeu : aucun fondu, la question s'affiche directement
  if(key !== lastScreen){ lastScreen = key; app.classList.remove("enter"); window.scrollTo(0,0); if(!playing){ void app.offsetWidth; app.classList.add("enter"); } }
  else app.classList.remove("enter");
}
function shuffle(a){ a = a.slice(); for(let i=a.length-1;i>0;i--){ const j = Math.floor(Math.random()*(i+1)); [a[i],a[j]] = [a[j],a[i]]; } return a; }
function srcLine(src){
  if(!src) return null;
  return h("div",{class:"src"}, svg('<path d="M4 5.5A2.5 2.5 0 0 1 6.5 3H20v15H6.5A2.5 2.5 0 0 0 4 20.5z"/><path d="M4 20.5A2.5 2.5 0 0 0 6.5 23H20v-5"/>'), h("span",null, h("b",null,"Source : "), src));
}
function pick(a){ return a[Math.floor(Math.random()*a.length)]; }
function toast(msg){ const t = h("div",{class:"toast",role:"status"},msg); document.body.append(t); setTimeout(()=>t.remove(), 2600); }
function confirmBox(text, yes, onYes){
  const m = h("div",{class:"modal"}, h("div",{class:"card"},
    h("p",null,text),
    h("div",{class:"row"},
      h("button",{class:"btn ghost center grow",onclick:()=>m.remove()},"Annuler"),
      h("button",{class:"btn primary grow",onclick:()=>{m.remove(); onYes();}},yes))));
  document.body.append(m);
}
function header(title, onBack){
  return h("div",{class:"top"},
    onBack ? h("button",{class:"back",onclick:onBack,"aria-label":"Retour"},"‹ Retour") : null,
    h("div",{class:"spacer"}),
    title ? h("span",{class:"label"},title) : null);
}
function chipGroup(options, value, onChange){
  const wrap = h("div",{class:"chips",role:"group"});
  function draw(){
    wrap.replaceChildren(...options.map(o => h("button",{class:"chip","aria-pressed":String(o.v===value),onclick:()=>{value=o.v; draw(); onChange(o.v);}}, o.l, o.n!=null ? h("span",{class:"n"},o.n) : null)));
  }
  draw(); return wrap;
}
function pool(cat, lvl){ const out=[]; Q.forEach((q,i)=>{ if(!q[7] && (cat==="*"||q[5]===cat) && (lvl==="*"||q[4]===lvl)) out.push(i); }); return out; }
function subOf(q){ return q[6]==="Elloul" ? "Roch Hachana" : q[6]; }
function fetePool(fete, lvl, sub){ const out=[]; Q.forEach((q,i)=>{ if(q[7]==="fete" && q[5]===fete && (lvl==="*"||q[4]===lvl) && (!sub||sub==="*"||subOf(q)===sub)) out.push(i); }); return out; }
let NMAIN = 0;
/* photos liées aux questions : data/photos.json = [{file, keys:[mots-clés], caption}] */
let PHOTOS = [];
function plain(t){ return (t||"").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/[’']/g,"'"); }
function photoFor(id){
  const q = Q[id]; if(!q || !PHOTOS.length) return null;
  const text = plain(q[0]+" "+q[1][q[2]]+" "+(q[6]||""));
  const hits = PHOTOS.filter(p => (p.keys||[]).some(k => text.includes(plain(k))));
  if(!hits.length) return null;
  let hsh = 0; for(const c of q[0]) hsh = (hsh*31 + c.charCodeAt(0)) >>> 0;
  return hits[hsh % hits.length];   // plusieurs photos possibles : on varie selon la question
}
// Limite les questions faciles à 30 % d'une partie quand plusieurs niveaux sont mélangés
function pickBalanced(ids, n){
  const easy = shuffle(ids.filter(i=>Q[i][4]==="1")), rest = shuffle(ids.filter(i=>Q[i][4]!=="1"));
  if(!easy.length || !rest.length) return shuffle(ids).slice(0, n);
  const ne = Math.min(easy.length, Math.max(n - rest.length, Math.round(n*0.3)));
  return shuffle(easy.slice(0, ne).concat(rest.slice(0, n - ne))).slice(0, n);
}
function countFor(cat, lvl){ return pool(cat,lvl).length; }

/* ---------- musique de fond ---------- */
const TITLE_FONTS = [
  '900 1em "Frank Ruhl Libre", Georgia, serif',
  'italic 900 1em "Playfair Display", Georgia, serif',
  '700 .92em "Cinzel", Georgia, serif',
  '400 1.12em "Bebas Neue", Impact, sans-serif',
  '800 .92em "Rubik", system-ui, sans-serif'
];
// Liste des nigounim joués en fond : il suffit d'ajouter un fichier dans assets/audio/ et son nom ici.
const NIGOUNIM = ["assets/audio/nigoun.mp3"];
let lastTrack = -1;
function nextTrack(){
  let i = Math.floor(Math.random()*NIGOUNIM.length);
  if(NIGOUNIM.length > 1) while(i === lastTrack) i = Math.floor(Math.random()*NIGOUNIM.length);
  lastTrack = i; return NIGOUNIM[i];
}
const music = { on: store.get("hq_music", true), el: null, ctx: null, an: null, data: null, avg: 0, last: 0, raf: 0, started: false };
const ICON_SOUND_ON = '<path d="M4 9v6h4l5 4V5L8 9z"/><path d="M16.5 8.5a5 5 0 0 1 0 7"/><path d="M19 6a8.5 8.5 0 0 1 0 12"/>';
const ICON_SOUND_OFF = '<path d="M4 9v6h4l5 4V5L8 9z"/><path d="M17 9l5 6M22 9l-5 6"/>';
const reduceMotion = matchMedia("(prefers-reduced-motion: reduce)").matches;
function beatTitle(){
  const el = h("h1",{class:"beat-title","aria-label":"770 Habad Quiz"});
  [["770","w n"],["Habad","w"],["Quiz","w"]].forEach(([word,cls])=>{
    el.append(h("span",{class:cls,"aria-hidden":"true"}, [...word].map(c=>h("span",{class:"l"},c))));
  });
  return el;
}
function swapFonts(){
  const t = app.querySelector(".beat-title"); if(!t) return;
  const f = TITLE_FONTS[Math.floor(Math.random()*TITLE_FONTS.length)];
  t.querySelectorAll(".l").forEach((l,i)=>{ l.style.font = (i%3===0) ? TITLE_FONTS[Math.floor(Math.random()*TITLE_FONTS.length)] : f; });
  t.classList.add("pulse"); setTimeout(()=>t.classList.remove("pulse"),110);
}
function resetFonts(){ const t = app.querySelector(".beat-title"); if(t) t.querySelectorAll(".l").forEach(l=>l.style.font=""); }
function musicLoop(){
  music.raf = requestAnimationFrame(musicLoop);
  if(!music.an || music.el.paused) return;
  music.an.getByteFrequencyData(music.data);
  let e = 0; for(let i=1;i<10;i++) e += music.data[i]; e /= 9;          // basses
  music.avg = music.avg ? music.avg*0.94 + e*0.06 : e;
  const now = performance.now();
  if(e > music.avg*1.05 && e > 110 && now - music.last > 230){ music.last = now; if(!reduceMotion) swapFonts(); }
}
function musicStart(){
  if(!music.on) return;
  if(!music.el){
    music.el = new Audio(nextTrack()); music.el.loop = false; music.el.volume = 0.4; music.el.preload = "auto";
    // à la fin d'un nigoun, on enchaîne sur un autre, tiré au hasard
    music.el.addEventListener("ended", ()=>{ if(!music.on) return; music.el.src = nextTrack(); music.el.play().catch(()=>{}); });

function startSolo(ids, title){

  const answers = []; let i = 0, score = 0, streak = 0, best = 0;
  const xpStart = XP, rankStart = rankOf(XP);
  function hudEl(){ return h("div",{class:"hud-r"},
    h("span",{class:"hud-chip streak"+(streak>=3?" hot":""),title:"Série"}, svg(ICON.flame), String(streak)),

  function step(){
    const id = ids[i]; const q = Q[id];
    const order = shuffle([0,1,2,3]);
    const fbWrap = h("div",{class:"stack"});
    let answered = false;
    const v = questionView(id, order, {index:i, total:ids.length, hud:hudEl(), onAnswer:(k)=>{
      if(answered) return; answered = true;
      const ok = order[k] === q[2];

      const picked = v.opts.children[k];
      let gain = 0;
      if(ok){

        gain = (LEVEL_POINTS[q[4]]||10) + (streak>=3 ? 5 : 0);
        score += gain; XP += gain; store.set("hq_xp", XP);
        burst(picked); floatPts(picked, "+"+gain);

      if(best > BEST_STREAK){ BEST_STREAK = best; store.set("hq_best", best); }
      touchDay(); record(id, ok); answers.push({id, ok, picked:q[1][order[k]]});
      const hud = app.querySelector(".hud-r"); if(hud) hud.replaceWith(hudEl());
      const ex = EXPL[q[0]];
      fbWrap.append(

function loadPeer(){
  if(window.Peer) return Promise.resolve();
  return new Promise((ok,ko)=>{ const s=document.createElement("script"); s.src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"; s.onload=ok; s.onerror=ko; document.head.append(s); });
}
function peerRoom(code, isHost){
  // Minimal stand-in for the room API, over PeerJS data channels (host is the hub)
  return new Promise((resolve, reject)=>{
    const hostId = "hq770-" + code.toLowerCase();
    const peer = isHost ? new Peer(hostId) : new Peer();
    const conns = {};            // host side: peerId -> {conn, presence}
    let hostConn = null;         // player side
    let peersCb = null, errCb = null, me = null, lastSt = null, done = false;
    const myPresence = {};
    function snapshot(){
      const list = [{peer:me, sameTab:true, presence:{...myPresence}}];
      for(const id in conns) list.push({peer:id, sameTab:false, presence:conns[id].presence});
      return list;
    }
    const emit = ()=>{ if(peersCb) peersCb({peers:snapshot()}); };
    const api = {
      presence(patch){
        for(const k in patch){ if(patch[k]===null) delete myPresence[k]; else myPresence[k]=patch[k]; }
        if(isHost){ if(patch.st){ lastSt = patch.st; for(const id in conns){ try{ conns[id].conn.send({t:"st", st:patch.st}); }catch(e){} } } }
        else if(hostConn && hostConn.open){ try{ hostConn.send({t:"p", patch}); }catch(e){} }
        return Promise.resolve();
      },
      onPeers(cb, onErr){ peersCb = cb; errCb = onErr; setTimeout(emit,0); return ()=>{ peersCb=null; }; },
      leave(){ done = true; try{ peer.destroy(); }catch(e){} return Promise.resolve(); }
    };
    peer.on("open", id=>{
      me = id;
      if(isHost){ resolve(api); return; }
      hostConn = peer.connect(hostId, {reliable:true});
      let opened = false;
      const t = setTimeout(()=>{ if(!opened){ done = true; try{ peer.destroy(); }catch(e){} reject(new Error("nohost")); } }, 9000);
      hostConn.on("open", ()=>{ opened = true; clearTimeout(t); hostConn.send({t:"p", patch:{...myPresence}}); resolve(api); });
      hostConn.on("data", m=>{ if(m && m.t==="st" && game && !game.isHost){ game.hostPeer = hostId; if(!game.st || m.st.v!==game.st.v){ game.st = m.st; playerRender(); } } });
      hostConn.on("close", ()=>{ if(!done && game && !game.isHost) hostGone(); });
    });
    peer.on("connection", conn=>{
      if(!isHost) return;
      conn.on("open", ()=>{ conns[conn.peer] = {conn, presence:{}}; if(lastSt) conn.send({t:"st", st:lastSt}); emit(); });
      conn.on("data", m=>{ if(m && m.t==="p" && conns[conn.peer]){ const pr = {...conns[conn.peer].presence}; for(const k in m.patch){ if(m.patch[k]===null) delete pr[k]; else pr[k]=m.patch[k]; } conns[conn.peer].presence = pr; emit(); } });
      conn.on("close", ()=>{ delete conns[conn.peer]; emit(); });
    });
    peer.on("error", e=>{
      if(done) return;
      if(e && e.type==="unavailable-id"){ done = true; try{ peer.destroy(); }catch(_){} reject(new Error("taken")); return; }
      if(e && e.type==="peer-unavailable"){ done = true; try{ peer.destroy(); }catch(_){} reject(new Error("nohost")); return; }
      if(me===null){ done = true; reject(e); }
    });
  });
}
async function joinGame(code, isHost){
  render(h("div",{class:"loading"},"Connexion au salon…"));
  let r;
  try{
    if(roomNS) r = await roomNS.join("hq-" + code.toLowerCase());
    else {
      await loadPeer();
      if(!isHost) myPresencePending = {r:"p", nm:myName};
      r = await peerRoom(code, isHost);
    }
  }
  catch(e){
    if(e && e.message==="taken" && isHost){ return joinGame(newCode(), true); }
    if(e && e.message==="nohost"){ render(header("Multijoueur", multiHome), h("h2",null,"Aucune partie trouvée"), h("p",{class:"muted"},`Personne n'héberge la partie ${code} en ce moment. Vérifiez le code auprès de l'organisateur et assurez-vous que son application est ouverte.`), h("button",{class:"btn primary",onclick:multiHome},"Retour")); return; }
    render(header("Multijoueur", multiHome), h("h2",null,"Connexion impossible"), h("p",{class:"muted"},"Impossible de rejoindre le salon. Vérifiez votre connexion et réessayez."), h("button",{class:"btn primary",onclick:multiHome},"Réessayer")); return;
  }
  game = {code, isHost, r, unsubs:[], st:null, hostPeer:null, myPeer:null, myAns:null, shownAt:0, shownIdx:-1, ended:false};
  const me = { r: isHost ? "h" : "p", nm: myName };
  await r.presence(me).catch(()=>{});
  game.unsubs.push(r.onPeers(ch => onPeersChange(ch.peers), ()=>{ if(!game.ended) lostRoom(); }));
  if(isHost) hostInit(); else waitHost();
}
function leaveGame(){
  if(!game) return;
  game.ended = true;
  clearInterval(game.tick);
  clearTimeout(game.waitT);
  game.unsubs.forEach(u=>{ try{u();}catch(e){} });
  game.r.leave().catch(()=>{});
  game = null;
}
function lostRoom(){ leaveGame(); render(header("Multijoueur", multiHome), h("h2",null,"Connexion perdue"), h("p",{class:"muted"},"La connexion à la partie s'est interrompue."), h("button",{class:"btn primary",onclick:multiHome},"Retour")); }
function quitBtn(){ return header(game ? "Code " + game.code : "", ()=>confirmBox("Quitter la partie ?","Quitter",()=>{ leaveGame(); multiHome(); })); }

function onPeersChange(peers){
  if(!game) return;
  const mine = peers.find(p=>p.sameTab); if(mine) game.myPeer = mine.peer;
  if(game.isHost){ hostOnPeers(peers); return; }
  const host = peers.find(p => p.presence && p.presence.r==="h" && !p.sameTab);
  if(!host){ if(game.hostPeer){ hostGone(); } return; }
  game.hostPeer = host.peer;
  const st = host.presence.st;
  if(st && (!game.st || st.v !== game.st.v)){ game.st = st; playerRender(); }
}
function waitHost(){
  render(quitBtn(), h("h2",null,"Recherche de la partie…"), h("p",{class:"muted"},`Code ${game.code}. Si rien ne se passe, vérifiez le code auprès de l'organisateur.`));
  game.waitT = setTimeout(()=>{ if(game && !game.hostPeer) render(quitBtn(), h("h2",null,"Aucune partie trouvée"), h("p",{class:"muted"},`Personne n'héberge la partie ${game.code} en ce moment. Vérifiez le code ou demandez à l'organisateur de garder l'application ouverte.`), h("p",{class:"muted small"},"La partie s'affichera dès que l'organisateur sera connecté.")); }, 6000);
}
function hostGone(){
  const code = game.code; leaveGame();
  render(header("Multijoueur", multiHome), h("h2",null,"L'organisateur a quitté la partie"), h("p",{class:"muted"},`La partie ${code} est terminée.`), h("button",{class:"btn primary",onclick:multiHome},"Retour"));
}

/* ----- host engine ----- */
function hostInit(){
  const g = game;
  g.players = {};      // peer -> {nm, s, ans:{} }
  g.ids = pickBalanced(pool(hostOpts.cat, hostOpts.lvl), hostOpts.n);
  g.time = hostOpts.t;
  g.cat = hostOpts.cat === "*" ? "Tous les thèmes" : hostOpts.cat;
  g.phase = "lobby"; g.i = -1; g.v = 0; g.order = null; g.deadline = 0; g.revealUntil = 0;
  g.tick = setInterval(hostTick, 250);
  hostPublish();
}
function hostOnPeers(peers){
  const g = game;
  for(const p of peers){
    if(p.sameTab){ g.myPeer = p.peer; }
    const pr = p.presence || {};
    const isPlayer = p.sameTab || pr.r === "p";
    if(!isPlayer) continue;
    if(!g.players[p.peer]) g.players[p.peer] = {nm: p.sameTab ? myName : (cleanName(pr.nm) || "Joueur"), s:0, ans:{}, on:true};
    const pl = g.players[p.peer];
    pl.on = true;
    if(!p.sameTab){ pl.nm = cleanName(pr.nm) || pl.nm; }
    const a = pr.a;
    if(!p.sameTab && a && g.phase==="q" && a.i===g.i && pl.ans[g.i]==null && Number.isInteger(a.c) && a.c>=0 && a.c<4){
      hostScore(pl, a.c, Number(a.ms)||g.time*1000);
    }
  }
  const here = new Set(peers.map(p=>p.peer));
  for(const k in g.players) g.players[k].on = here.has(k);
  // publish only when players or answers changed (our own presence updates also land here)
  const sig = JSON.stringify(Object.entries(g.players).map(([k,p])=>[k,p.nm,p.on,p.s,Object.keys(p.ans).length]));
  if(sig !== g.sig){ g.sig = sig; hostPublish(); }
}
function hostScore(pl, c, ms){
  const g = game;
  const q = Q[g.ids[g.i]];
  const ok = g.order[c] === q[2];
  ms = Math.max(0, Math.min(ms, g.time*1000));
  const pts = ok ? Math.round(1000 - 500*(ms/(g.time*1000))) : 0;
  pl.ans[g.i] = {c, ok, pts}; pl.s += pts;
}
function hostAnswer(k){ // the host plays too
  const g = game; if(!g || g.phase!=="q") return;
  const pl = g.players[g.myPeer] || (g.players[g.myPeer] = {nm:myName, s:0, ans:{}, on:true});
  if(pl.ans[g.i]!=null) return;
  hostScore(pl, k, Date.now() - g.qStart);
  record(g.ids[g.i], pl.ans[g.i].ok);
  hostPublish();
}
function hostStart(){
  const g = game; if(!g.ids.length) return;
  for(const k in g.players){ g.players[k].s = 0; g.players[k].ans = {}; }
  hostNext(0);
}
function hostNext(i){
  const g = game;
  g.i = i; g.phase = "q"; g.order = shuffle([0,1,2,3]);
  g.qStart = Date.now(); g.deadline = g.qStart + g.time*1000;
  hostPublish();
}
function hostTick(){
  const g = game; if(!g || !g.isHost) return;
  const now = Date.now();
  if(g.phase === "q"){
    const active = Object.values(g.players).filter(p=>p.on);
    const allIn = active.length>0 && active.every(p=>p.ans[g.i]!=null);
    if(now >= g.deadline || allIn){ g.phase = "rv"; g.revealUntil = now + 5000; hostPublish(); return; }
    const rem = Math.ceil((g.deadline-now)/1000);
    if(rem !== g.lastRem){ g.lastRem = rem; hostPublish(); }
  } else if(g.phase === "rv" && now >= g.revealUntil){
    if(g.i+1 < g.ids.length) hostNext(g.i+1); else { g.phase = "end"; hostPublish(); }
  }
}
function hostState(){
  const g = game;
  const sc = Object.entries(g.players).filter(([k,p])=>p.on || p.s>0)
    .map(([k,p])=>[k, p.nm, p.s, g.phase==="q" ? (p.ans[g.i]!=null?1:0) : (p.ans[g.i] ? (p.ans[g.i].ok?1:0) : -1)])
    .sort((a,b)=>b[2]-a[2]).slice(0,30);
  const st = {v:++g.v, ph:g.phase, i:g.i, n:g.ids.length, t:g.time, cat:g.cat, sc};
  if(g.phase==="q" || g.phase==="rv"){
    const q = Q[g.ids[g.i]];
    st.q = {id:g.ids[g.i], o:g.order};
    st.rem = Math.max(0, Math.ceil((g.deadline-Date.now())/1000));
    if(g.phase==="rv") st.c = g.order.indexOf(q[2]);
  }
  return st;
}
function hostPublish(){
  const g = game; if(!g || g.ended) return;
  const st = hostState();
  // keep presence under 4 KiB: shrink the scoreboard if needed
  while(JSON.stringify(st).length > 3600 && st.sc.length > 3) st.sc.pop();
  g.st = st;
  g.r.presence({r:"h", nm:myName, st}).catch(()=>{});
  playerRender();
}

/* ----- shared rendering for host & players ----- */
function scoreboard(sc, phase){
  return h("div",{class:"players"}, sc.map(([peer,nm,s,flag],idx)=> h("div",{class:"player"+(peer===game.myPeer?" me":"")},
    h("div",{class:"row"}, h("span",{class:"rk"}, String(idx+1)), h("span",null, nm + (peer===game.myPeer?" (vous)":""))),
    h("div",{class:"row"},
      phase==="q" ? h("span",{class:"st"}, flag ? "a répondu" : "réfléchit…") :
      phase==="rv" ? h("span",{class:"st",style:`color:${flag===1?"var(--good)":flag===0?"var(--bad)":"var(--muted)"}`}, flag===1?"juste":flag===0?"faux":"pas de réponse") : null,
      h("b",null, s.toLocaleString("fr-FR"))))));
}
function playerRender(){
  const g = game; if(!g) return;
  const st = g.st; if(!st) return;
  clearTimeout(g.waitT);
  // remember when this player first saw the current question
  if(st.ph==="q" && g.shownIdx !== st.i){ g.shownIdx = st.i; g.shownAt = Date.now(); g.myAns = null; if(!g.isHost) g.r.presence({a:null}).catch(()=>{}); }
  if(st.ph === "lobby"){ g.shownIdx = -1; g.recorded = -1; g.myAns = null; return lobbyView(st); }
  if(st.ph === "end") return endView(st);
  const id = st.q.id; const q = Q[id]; if(!q) return;
  const mineHost = g.isHost ? (g.players[g.myPeer]||{ans:{}}).ans[st.i] : null;
  const chosen = g.isHost ? (mineHost ? mineHost.c : null) : g.myAns;
  const timer = h("span",{class:"timer"+(st.rem<=5?" low":"")}, st.ph==="q" ? st.rem+" s" : "");
  const v = questionView(id, st.q.o, {index:st.i, total:st.n, timerEl:timer, chosen, locked: st.ph!=="q" || chosen!=null,
    onAnswer:(k)=>{
      if(g.isHost){ hostAnswer(k); return; }
      if(g.myAns!=null || g.st.ph!=="q") return;
      g.myAns = k;
      g.r.presence({a:{i:st.i, c:k, ms:Date.now()-g.shownAt}}).catch(()=>{});
      playerRender();
    }});
  if(st.ph === "rv"){
    [...v.opts.children].forEach((b,j)=>{ if(j===st.c) b.classList.add("ok"); else if(j===chosen) b.classList.add("ko"); });
    if(!g.isHost && g.recorded !== st.i && chosen!=null){ g.recorded = st.i; record(id, chosen===st.c); }
  }
  const info = st.ph==="rv"
    ? h("div",{class:"feedback"+(chosen===st.c?"":" bad")}, h("b",null, chosen==null ? `Temps écoulé. La bonne réponse était : ${q[1][q[2]]}` : chosen===st.c ? "Bonne réponse" : `Réponse incorrecte. La bonne réponse était : ${q[1][q[2]]}`), srcLine(q[3]))
    : chosen!=null ? h("p",{class:"muted small"},"Réponse enregistrée. En attente des autres joueurs…") : null;
  render(quitBtn(), v.node, info, h("span",{class:"label"}, st.ph==="rv" ? "Classement" : "Joueurs"), scoreboard(st.sc, st.ph));
}
function lobbyView(st){
  const g = game;
  const canStart = g.isHost && st.sc.length >= 1;
  render(
    quitBtn(),
    h("div",{class:"card stack",style:"text-align:center"},
      h("span",{class:"label"}, g.isHost ? "Code à partager" : "Vous avez rejoint le salon"),
      h("div",{class:"codebox"}, g.code),
      g.isHost ? h("button",{class:"btn ghost center",onclick:()=>{ navigator.clipboard?.writeText(g.code).then(()=>toast("Code copié"),()=>toast("Copie impossible. Communiquez le code manuellement.")); }},"Copier le code") : null),
    h("p",{class:"muted"}, `${st.cat} · ${st.n} questions · ${st.t} s par question`),
    h("span",{class:"label"}, `Joueurs (${st.sc.length})`),
    scoreboard(st.sc, "lobby"),
    h("div",{class:"spacer"}),
    g.isHost
      ? h("button",{class:"btn primary",disabled:!canStart,onclick:hostStart},"Lancer la partie")
      : h("p",{class:"muted center"},"En attente du lancement par l'organisateur…")
  );
}
function endView(st){
  const g = game;
  const winner = st.sc[0];
  const myRank = st.sc.findIndex(s=>s[0]===g.myPeer);
  render(
    quitBtn(),
    h("div",{class:"stack"},
      h("span",{class:"label"},"Partie terminée"),
      h("h2",null, winner ? `${winner[1]} gagne avec ${winner[2].toLocaleString("fr-FR")} points` : "Partie terminée"),
      myRank>=0 ? h("p",{class:"muted"}, `Votre classement : ${myRank===0?"1er":(myRank+1)+"e"} sur ${st.sc.length}.`) : null),
    scoreboard(st.sc, "end"),
    h("div",{class:"spacer"}),
    g.isHost
      ? h("div",{class:"row"},
          h("button",{class:"btn primary grow",onclick:()=>{ g.ids = pickBalanced(pool(hostOpts.cat, hostOpts.lvl), hostOpts.n); g.phase="lobby"; g.i=-1; for(const k in g.players){ g.players[k].s=0; g.players[k].ans={}; } hostPublish(); }},"Nouvelle manche"),
          h("button",{class:"btn ghost center grow",onclick:()=>{ leaveGame(); home(); }},"Terminer"))
      : h("button",{class:"btn ghost center",onclick:()=>{ leaveGame(); home(); }},"Retour à l'accueil")
  );
}

/* ---------- boot ---------- */
if("serviceWorker" in navigator){ try{ navigator.serviceWorker.register("sw.js").catch(()=>{}); }catch(e){} }
Promise.all([
  fetch("data/questions.json").then(r=>{ if(!r.ok) throw new Error(r.status); return r.json(); }),
  fetch("data/fetes.json").then(r=> r.ok ? r.json() : []).catch(()=>[]),
  fetch("data/photos.json").then(r=> r.ok ? r.json() : []).catch(()=>[]),
  fetch("data/explications.json").then(r=> r.ok ? r.json() : {}).catch(()=>({}))
]).then(([data, fetes, photos, expl])=>{
  EXPL = expl && typeof expl === "object" ? expl : {};
  PHOTOS = Array.isArray(photos) ? photos : [];
  NMAIN = data.length;
  Q = data.concat(fetes.map(f=>[f[0],f[1],f[2],f[3],f[4],f[5],f[6],"fete"]));
  const order = ["Les 7 Rabbeim","Philosophie & Textes","Minhaguim & Coutumes","Histoire & Dates","Histoire & Lieux","Mivtsaim & Campagnes","Institutions & Rayonnement","Nigounim & Figures"];
  const seen = [...new Set(data.map(q=>q[5]))];
  CATS = order.filter(c=>seen.includes(c)).concat(seen.filter(c=>!order.includes(c)));
  return loadProgress().then(()=>home());
}).catch(()=>{
  render(h("h2",null,"Les questions n'ont pas pu être chargées"), h("p",{class:"muted"},"Vérifiez votre connexion puis rechargez la page."), h("button",{class:"btn primary",onclick:()=>location.reload()},"Recharger"));
});
</script>
</body>
